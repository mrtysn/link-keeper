<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Link Keeper — list</title>
<style>
  :root {
    --bg: #fbfaf8; --panel: #fff; --ink: #1a1a1a; --dim: #6b6b6b;
    --line: #e4e0da; --accent: #7a5cff; --ok: #17915c; --bad: #c2422f;
    --seen: #8a7a3f; --chip: #f1eee9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --panel: #22252a; --ink: #e8e6e3; --dim: #9a9793;
      --line: #2c2f34; --accent: #a992ff; --ok: #4fcf95; --bad: #ff8b74;
      --seen: #d8c47a; --chip: #2a2e34;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1.25rem 5rem; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 64rem; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 .15rem; letter-spacing: -.02em; }
  .sub { color: var(--dim); font-size: .88rem; margin: 0 0 1.2rem; }

  .meter { height: 5px; background: var(--chip); border-radius: 3px; overflow: hidden; display: flex; }
  .meter i { height: 100%; transition: width .25s ease; }
  .meter .k { background: var(--ok); } .meter .s { background: var(--seen); }

  .bar {
    display: flex; gap: .5rem; flex-wrap: wrap; align-items: center;
    margin: .9rem 0 1.4rem; position: sticky; top: 0; background: var(--bg);
    padding: .7rem 0; z-index: 5; border-bottom: 1px solid var(--line);
  }
  #q { flex: 1 1 16rem; padding: .5rem .75rem; font: inherit; color: var(--ink);
       background: var(--panel); border: 1px solid var(--line); border-radius: .45rem; }
  #q:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button, select {
    font: inherit; font-size: .88rem; cursor: pointer; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: .45rem; padding: .45rem .75rem;
  }
  button:hover { border-color: var(--accent); }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  .chips { display: flex; gap: .3rem; }
  .chip {
    border: 1px solid var(--line); background: var(--panel); border-radius: 1rem;
    padding: .3rem .75rem; font-size: .82rem; cursor: pointer; color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  .group { margin: 1.6rem 0 0; }
  .group > h2 {
    font-size: .92rem; font-weight: 600; margin: 0 0 .5rem; display: flex; gap: .6rem;
    align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: .4rem;
  }
  .group > h2 .n { color: var(--dim); font-size: .78rem; font-variant-numeric: tabular-nums; }
  .group > h2 button { margin-left: auto; font-size: .78rem; padding: .2rem .55rem; }

  ul.rows { list-style: none; margin: 0; padding: 0; }
  ul.rows li {
    display: grid; grid-template-columns: 1.6rem 1fr auto; gap: .7rem; align-items: start;
    padding: .45rem .3rem; border-radius: .4rem;
  }
  ul.rows li:hover { background: var(--panel); }
  ul.rows li.current { box-shadow: inset 2px 0 0 var(--accent); }
  .dot { width: .6rem; height: .6rem; border-radius: 50%; margin-top: .45rem; background: var(--line); justify-self: center; }
  li[data-status="seen"] .dot { background: var(--seen); }
  li[data-status="kept"] .dot { background: var(--ok); }
  .main { min-width: 0; }
  .ttl { font-weight: 600; overflow-wrap: anywhere; }
  .ttl.plain { font-weight: 400; font-family: ui-monospace, Menlo, monospace; font-size: .85rem; }
  a.ttl { color: var(--ink); text-decoration: none; }
  a.ttl:hover { color: var(--accent); text-decoration: underline; }
  .meta { color: var(--dim); font-size: .8rem; display: flex; gap: .6rem; flex-wrap: wrap; }
  .body { color: var(--dim); font-size: .85rem; overflow-wrap: anywhere;
          display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .inner { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .2rem; }
  .inner a {
    font-size: .78rem; color: var(--accent); text-decoration: none; background: var(--chip);
    border-radius: 1rem; padding: .12rem .5rem; max-width: 22rem; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .note { font-size: .82rem; background: var(--chip); border-radius: .3rem; padding: .1rem .4rem; display: inline-block; }
  .acts { display: flex; gap: .25rem; opacity: 0; }
  ul.rows li:hover .acts, ul.rows li:focus-within .acts { opacity: 1; }
  .acts button { padding: .2rem .5rem; font-size: .78rem; }
  .empty { color: var(--dim); text-align: center; padding: 4rem 1rem; border: 1px dashed var(--line); border-radius: .8rem; }
  .empty b { display: block; color: var(--ink); font-size: 1.05rem; margin-bottom: .3rem; }
  #msg { color: var(--dim); font-size: .82rem; min-height: 1.2rem; margin-top: .5rem; }
  kbd { background: var(--chip); border: 1px solid var(--line); border-bottom-width: 2px;
        border-radius: .25rem; padding: 0 .25rem; font-size: .78rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Link Keeper</h1>
  <p class="sub" id="sub">loading…</p>

  <div class="meter"><i class="k" id="bar-kept"></i><i class="s" id="bar-seen"></i></div>

  <div class="bar">
    <input id="q" type="search" placeholder="Filter by URL, title, note…" autocomplete="off" spellcheck="false">
    <div class="chips" role="group">
      <button class="chip" id="f-all" aria-pressed="true">all</button>
      <button class="chip" id="f-pending" aria-pressed="false">left</button>
      <button class="chip" id="f-seen" aria-pressed="false">seen</button>
      <button class="chip" id="f-kept" aria-pressed="false">kept</button>
    </div>
    <select id="groupby" title="Grouping">
      <option value="domain">by domain</option>
      <option value="status">by status</option>
      <option value="flat">flat, newest first</option>
    </select>
    <button id="export">Export captures</button>
    <button class="danger" id="tidy" title="Remove kept and seen entries from the list">Tidy</button>
  </div>

  <div id="msg"></div>
  <div id="out"></div>
</div>
<script src="list.js"></script>
</body>
</html>
