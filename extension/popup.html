<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    /* Measured in WCAG 2 and APCA on every ground these pages use. WCAG overrates light text on a
       dark ground, so the dark greys, accent and reds were lifted until APCA agreed; only lightness
       moved. --field is a field's edge (3:1), --prose is text that runs to lines (Lc 75+). */
    --bg: #fbfaf8; --panel: #fff; --ink: #1a1a1a; --dim: #555555; --line: #e4e0da; --mark: #8a857d; --field: #95918b; --prose: #555555;
    --accent: #6647e6; --on-accent: #fff; --ok: #107647; --bad: #b33a28; --seen: #8a7a3f; --chip: #f1eee9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1e22; --panel: #24272c; --ink: #e8e6e3; --dim: #c0bdb9; --line: #33373d; --mark: #6b6f77; --field: #7d8289; --prose: #d8d5d1;
      --accent: #c1b4fe; --on-accent: #16171a; --ok: #4fcf95; --bad: #ffa693; --seen: #d8c47a; --chip: #2b2f35;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  /* max-width lets the layout give way to a scrollbar instead of sliding under it. */
  body {
    width: 22rem; max-width: 100%; margin: 0; padding: 12px; background: var(--bg); color: var(--ink);
    font: 13px/1.45 ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  header img { width: 20px; height: 20px; }
  h1 { font-size: 15px; line-height: 1.2; letter-spacing: -.01em; margin: 0; }

  button {
    font: inherit; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 32px; padding: 6px 10px; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px;
    transition-property: border-color, background-color, color; transition-duration: 150ms;
  }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.ghost { background: none; border-color: transparent; color: var(--dim); min-height: 26px; padding: 3px 6px; }
  @media (hover: hover) {
    button:hover:not(:disabled) { border-color: var(--accent); }
    button.ghost:hover:not(:disabled) { background: var(--chip); border-color: transparent; color: var(--ink); }
  }
  @media (prefers-reduced-motion: no-preference) {
    button { transition-property: border-color, background-color, color, scale; }
    button:active:not(:disabled) { scale: .97; }
  }
  kbd { font: 11px/1 ui-sans-serif, -apple-system, sans-serif; letter-spacing: .02em; opacity: .7; }
  button.primary kbd { opacity: 1; }
  input {
    font: inherit; width: 100%; background: var(--panel); color: var(--ink);
    border: 1px solid var(--field); border-radius: 8px; padding: 6px 9px;
  }

  /* --- the three viewers, the popup's main job --- */
  .views { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .view {
    display: grid; justify-items: start; align-content: start; gap: 2px; min-height: 76px; padding: 9px 10px;
    text-align: left; border-radius: 10px;
  }
  .view b { font-size: 14px; }
  .view .big { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .view .small { color: var(--dim); font-size: 11.5px; line-height: 1.3; }
  .sources { display: flex; flex-wrap: wrap; gap: 2px 10px; margin: 6px 2px 0; color: var(--dim); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .sources button { min-height: 0; padding: 0; border: 0; background: none; color: inherit; font-size: inherit; text-decoration: underline dotted; text-underline-offset: 2px; }
  .sources .off { opacity: .55; }

  section { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
  h2 { display: flex; gap: 6px; margin: 0 0 6px; color: var(--dim); font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  h2 .n { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; font-variant-numeric: tabular-nums; }

  /* --- this tab: split buttons, the arrow half opening its menu --- */
  /* Firefox may give the popup less than its 22rem; the shortcut hints go before a label wraps. */
  .thistab { container-type: inline-size; }
  .tabacts { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 6px; }
  .tabacts button { white-space: nowrap; min-width: 0; }
  @container (max-width: 19.5rem) { .tabacts kbd { display: none; } }
  .split { display: flex; }
  .split > button:first-child { flex: 1; border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .split > button.arrow { width: 26px; padding: 0; border-left: 0; border-top-left-radius: 0; border-bottom-left-radius: 0; }
  .split > button.primary + button.arrow { background: var(--accent); border-color: var(--accent); color: var(--on-accent); box-shadow: inset 1px 0 0 rgb(0 0 0 / .15); }
  .menu {
    position: fixed; inset: auto; margin: 0; min-width: 11rem; padding: 4px;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 24px rgb(0 0 0 / .25);
  }
  .menu button { display: flex; width: 100%; min-height: 30px; justify-content: flex-start; border: 0; border-radius: 6px; background: none; }
  @media (hover: hover) { .menu button:hover:not(:disabled) { background: var(--chip); } }
  #note-row { margin-top: 6px; }

  /* --- the reading list's next link --- */
  .next { display: flex; align-items: center; gap: 6px; }
  .next .url { flex: 1; min-width: 0; font: 12px/1.45 ui-monospace, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .next .url.done { font-family: inherit; color: var(--dim); }
  .next .lbl { flex: none; color: var(--dim); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }

  .msg { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; }
  .msg:has(#msg:empty) { margin-top: 0; }
  #msg {
    flex: 1; min-width: 0; margin: 0; padding: 4px 0 4px 10px; border-left: 2px solid var(--line);
    font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  #msg:empty { padding: 0; border: 0; }
  #msg.ok { border-color: var(--ok); }
  #msg.bad { border-color: var(--bad); color: var(--bad); }
</style>
</head>
<body>
  <header>
    <img src="icon.svg" alt="">
    <h1>Link Keeper</h1>
  </header>

  <nav class="views" aria-label="Open a viewer">
    <button class="view" id="open-list" title="All links, in the grouping you choose"><b>List</b><span class="big" id="n-links">—</span><span class="small">links shown</span></button>
    <button class="view" id="open-cards" title="Go through undecided links one card at a time, shuffled"><b>Cards</b><span class="big" id="n-undecided">—</span><span class="small">to judge</span></button>
    <button class="view" id="open-explore" title="All links in a sidebar, with a live preview of the selected one"><b>Explore</b><span class="big" id="n-stashes">—</span><span class="small" id="n-stashes-word">stashes</span></button>
  </nav>
  <p class="sources" id="sources" aria-label="Links per source"></p>

  <section class="thistab" aria-labelledby="tab-h">
    <h2 id="tab-h">This tab</h2>
    <div class="tabacts">
      <div class="split">
        <button id="stash" title="Stash the selected tabs, or the whole window, and close them">Stash <kbd aria-hidden="true">&#8963;&#8679;S</kbd></button>
        <button class="arrow" id="stash-more" popovertarget="stash-menu" aria-label="Stash only some tabs">&#9662;</button>
      </div>
      <div class="split">
        <button id="keep" title="Save this page's text, images and links">Capture <kbd aria-hidden="true">&#8963;&#8679;K</kbd></button>
        <button class="arrow" id="keep-more" popovertarget="keep-menu" aria-label="Capture with a screenshot or a note">&#9662;</button>
      </div>
      <button id="queue" title="Add this page to the reading list">+ List</button>
    </div>
    <div id="note-row" hidden>
      <label class="sr-only" for="note">Note for the next keep</label>
      <input id="note" placeholder="Note for the next keep" autocomplete="off">
    </div>
    <div class="menu" id="stash-menu" popover>
      <button data-scope="window">All tabs in this window</button>
      <button data-scope="tab">Only this tab</button>
      <button data-scope="left">Tabs to the left</button>
      <button data-scope="right">Tabs to the right</button>
      <button data-scope="others">All except this one</button>
      <button data-scope="all-windows">Every window, one stash each</button>
    </div>
    <div class="menu" id="keep-menu" popover>
      <button id="keep-shot">Capture with a full-page screenshot</button>
      <button id="keep-note">Capture with a note…</button>
    </div>
  </section>

  <section aria-labelledby="list-h">
    <h2 id="list-h">Reading list <span class="n" id="left"></span></h2>
    <div class="next">
      <span class="lbl" id="now-lbl">next</span>
      <span class="url" id="now-url">—</span>
      <button id="next" title="Open the next link in this tab">Next <kbd aria-hidden="true">&#8963;&#8679;J</kbd></button>
      <button id="skip" title="Mark this link skipped and open the next">Skip</button>
    </div>
  </section>

  <div class="msg">
    <p id="msg" role="status"></p>
    <button class="ghost" id="copy-msg" hidden title="Copy this message">Copy</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
