<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #fbfaf8; --panel: #fff; --ink: #1a1a1a; --dim: #6b6b6b; --line: #e4e0da; --mark: #8a857d;
    --accent: #6647e6; --on-accent: #fff; --ok: #107647; --bad: #b33a28; --seen: #8a7a3f; --chip: #f1eee9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1e22; --panel: #24272c; --ink: #e8e6e3; --dim: #9a9793; --line: #33373d; --mark: #6b6f77;
      --accent: #a992ff; --on-accent: #16171a; --ok: #4fcf95; --bad: #ff8b74; --seen: #d8c47a; --chip: #2b2f35;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  /* max-width lets the layout give way to a scrollbar instead of sliding under it. */
  body {
    width: 22rem; max-width: 100%; margin: 0; padding: 12px; background: var(--bg); color: var(--ink);
    font: 13px/1.45 ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { display: grid; gap: 6px; }
  .title { display: flex; align-items: center; gap: 2px; }
  h1 { font-size: 15px; line-height: 1.2; letter-spacing: -.01em; margin: 0 auto 0 0; }
  .tally { margin: 0; color: var(--dim); font-variant-numeric: tabular-nums; }
  .tally b { color: var(--ink); font-weight: 600; }

  .meter { height: 4px; background: var(--chip); border-radius: 2px; overflow: hidden; display: flex; }
  .meter i { height: 100%; }
  .meter .k { background: var(--ok); } .meter .s { background: var(--seen); } .meter .x { background: var(--bad); }

  button {
    font: inherit; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 32px; padding: 6px 10px; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px;
    transition-property: border-color, background-color, color; transition-duration: 150ms;
  }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.ghost { background: none; border-color: transparent; color: var(--dim); min-height: 28px; padding: 4px 8px; }
  button.danger { color: var(--bad); }
  @media (hover: hover) {
    button:hover:not(:disabled) { border-color: var(--accent); }
    button.ghost:hover:not(:disabled) { background: var(--chip); border-color: transparent; color: var(--ink); }
    button.danger:hover:not(:disabled) { border-color: var(--bad); }
  }
  @media (prefers-reduced-motion: no-preference) {
    button { transition-property: border-color, background-color, color, scale; }
    button:active:not(:disabled) { scale: .96; }
    .meter i { transition: width .25s ease; }
  }
  kbd { font: 11px/1 ui-sans-serif, -apple-system, sans-serif; letter-spacing: .02em; opacity: .7; }
  button.primary kbd { opacity: 1; }

  input, textarea {
    font: inherit; width: 100%; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px;
  }
  textarea { display: block; min-height: 4.5rem; resize: vertical; font: 12px/1.45 ui-monospace, Menlo, monospace; }

  .now { margin: 12px 0 8px; padding: 7px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .now .lbl { color: var(--dim); font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .now .url { font: 12px/1.45 ui-monospace, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }

  .msg { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; }
  .msg:has(#msg:empty) { margin-top: 0; }
  #msg {
    flex: 1; min-width: 0; margin: 0; padding: 4px 0 4px 10px; border-left: 2px solid var(--line);
    font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  #msg:empty { padding: 0; border: 0; }
  #msg.ok { border-color: var(--ok); }
  #msg.bad { border-color: var(--bad); color: var(--bad); }

  .recent { margin-top: 12px; }
  h2 { margin: 0 0 4px; color: var(--dim); font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  #recent { list-style: none; margin: 0; padding: 0; font-size: 12px; color: var(--dim); }
  #recent li { display: flex; gap: 8px; padding: 1px 0; }
  #recent .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #recent .who { color: var(--ink); font-weight: 600; }
  #recent .n { flex: none; font-variant-numeric: tabular-nums; }

  details { margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--line); }
  summary { cursor: pointer; color: var(--dim); padding: 2px 0; }
  details[open] summary { color: var(--ink); margin-bottom: 6px; }
  .recent + details { margin-top: 12px; }
  @media (hover: hover) { summary:hover { color: var(--ink); } }
  details .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .wide { grid-column: 1 / -1; }
  details label { display: block; margin: 12px 0 4px; color: var(--dim); font-size: 12px; }
  details p { margin: 8px 0 0; color: var(--dim); font-size: 12px; text-wrap: pretty; }
  code { background: var(--chip); padding: 0 .2rem; border-radius: .2rem; }
</style>
</head>
<body>
  <header>
    <div class="title">
      <h1>Link Keeper</h1>
      <button class="ghost" id="open-list">Open list</button>
      <button class="ghost" id="open-cards">Cards</button>
    </div>
    <p class="tally" id="tally"></p>
    <div class="meter" aria-hidden="true"><i class="k" id="bar-kept"></i><i class="s" id="bar-seen"></i><i class="x" id="bar-skipped"></i></div>
  </header>

  <div class="now">
    <div class="lbl" id="now-lbl">next</div>
    <div class="url" id="now-url">list is empty</div>
  </div>

  <label class="sr-only" for="note">Note for the next keep</label>
  <input id="note" placeholder="Note for the next keep (optional)" autocomplete="off">

  <div class="actions">
    <button id="keep" title="Read this page and store the capture">Keep <kbd aria-hidden="true">&#8963;&#8679;K</kbd></button>
    <button id="keep-shot" title="Keep, then scroll and stitch a full-page PNG">Keep + shot</button>
    <button id="skip" title="Mark as rejected, then advance">Skip <kbd aria-hidden="true">&#8963;&#8679;X</kbd></button>
    <button id="next" title="Advance without judging">Next <kbd aria-hidden="true">&#8963;&#8679;J</kbd></button>
  </div>

  <div class="msg">
    <p id="msg" role="status"></p>
    <button class="ghost" id="copy-msg" hidden title="Copy this message">Copy</button>
  </div>

  <section class="recent" id="recent-box" hidden>
    <h2>Recently kept</h2>
    <ul id="recent"></ul>
  </section>

  <details>
    <summary>Add links</summary>
    <label class="sr-only" for="urls">Links to add, one per line</label>
    <textarea id="urls" placeholder="one URL per line, optionally followed by the date it was saved"></textarea>
    <div class="grid">
      <button id="queue" title="Add the page you are on to the list">Add this page <kbd aria-hidden="true">&#8963;&#8679;U</kbd></button>
      <button id="add">Add links</button>
    </div>
  </details>

  <details>
    <summary>Export and housekeeping</summary>
    <div class="grid">
      <button id="export">Export captures</button>
      <button id="export-list">Export list</button>
      <button class="wide" id="go-import">Import captures…</button>
      <button id="reset">Reset seen</button>
      <button class="danger" id="clear-captures">Clear captures…</button>
      <button class="danger wide" id="clear-list">Clear list…</button>
    </div>
    <label for="folder">Screenshot folder inside Downloads</label>
    <input id="folder" placeholder="link-keeper" autocomplete="off">
    <p>Screenshots go to <code>Downloads/<span id="folder-echo">link-keeper</span>/</code>. Extensions
    cannot write elsewhere, so symlink it if you need to. Exports land in Downloads as JSONL. Reset
    clears “seen”, never “kept”.</p>
  </details>

  <script src="popup.js"></script>
</body>
</html>
