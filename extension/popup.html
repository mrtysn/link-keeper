<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #fbfaf8; --panel: #fff; --ink: #1a1a1a; --dim: #6b6b6b;
    --line: #e4e0da; --accent: #7a5cff; --ok: #17915c; --bad: #c2422f;
    --seen: #8a7a3f; --chip: #f1eee9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1e22; --panel: #24272c; --ink: #e8e6e3; --dim: #9a9793;
      --line: #33373d; --accent: #a992ff; --ok: #4fcf95; --bad: #ff8b74;
      --seen: #d8c47a; --chip: #2b2f35;
    }
  }
  * { box-sizing: border-box; }
  body {
    width: 21rem; margin: 0; padding: .8rem; background: var(--bg); color: var(--ink);
    font: 13px/1.45 ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif;
  }
  header { display: flex; align-items: baseline; gap: .5rem; margin-bottom: .5rem; }
  h1 { font-size: .9rem; margin: 0; }
  #tally { color: var(--dim); font-size: .78rem; font-variant-numeric: tabular-nums; margin-left: auto; }
  #tally b { color: var(--ink); }

  .meter { height: 4px; background: var(--chip); border-radius: 2px; overflow: hidden; display: flex; }
  .meter i { height: 100%; transition: width .25s ease; }
  .meter .k { background: var(--ok); } .meter .s { background: var(--seen); }
  .meter .x { background: var(--bad); }

  .now {
    margin: .55rem 0; padding: .4rem .55rem; background: var(--panel);
    border: 1px solid var(--line); border-radius: .4rem;
  }
  .now .lbl { color: var(--dim); font-size: .68rem; text-transform: uppercase; letter-spacing: .07em; }
  .now .url {
    font-family: ui-monospace, Menlo, monospace; font-size: .76rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: .35rem; }
  button {
    font: inherit; font-size: .82rem; cursor: pointer; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: .4rem; padding: .42rem .5rem;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button.wide, input.wide { grid-column: 1 / -1; }
  button.go { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.top { width: 100%; margin-top: .55rem; }
  /* Next is pressed once per link — the biggest target, and the one the eye lands on. */
  button.big { padding: .55rem .5rem; font-size: .88rem; font-weight: 600; }
  button.keep { color: var(--ok); font-weight: 600; }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }

  input, textarea {
    font: inherit; font-size: .82rem; width: 100%; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: .4rem; padding: .35rem .5rem;
  }
  textarea { min-height: 4rem; resize: vertical; font-family: ui-monospace, Menlo, monospace; font-size: .76rem; }

  .keys { color: var(--dim); font-size: .72rem; margin: .5rem 0 0; text-align: center; }
  kbd { font: inherit; color: var(--ink); }

  #msg-row { display: flex; gap: .4rem; align-items: flex-start; margin-top: .5rem; min-height: 1rem; }
  #msg { font-size: .76rem; color: var(--dim); white-space: pre-wrap; flex: 1; }
  #msg.bad { color: var(--bad); } #msg.ok { color: var(--ok); }
  #copy-msg { font-size: .72rem; padding: .1rem .35rem; }

  #recent { list-style: none; margin: .5rem 0 0; padding: 0; font-size: .74rem; color: var(--dim); }
  #recent li {
    padding: .18rem 0; border-top: 1px solid var(--line);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #recent b { color: var(--ink); font-weight: 600; }

  details { margin-top: .6rem; border-top: 1px solid var(--line); padding-top: .4rem; }
  summary { cursor: pointer; color: var(--dim); font-size: .78rem; }
  details .grid { margin-top: .4rem; }
  details p { color: var(--dim); font-size: .72rem; margin: .35rem 0 0; }
  details input { margin-top: .35rem; }
  label#import-label {
    display: block; text-align: center; font-size: .82rem; cursor: pointer; padding: .42rem .5rem;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: .4rem;
  }
  label#import-label:hover { border-color: var(--accent); }
  code { background: var(--chip); padding: 0 .2rem; border-radius: .2rem; }
</style>
</head>
<body>
  <header>
    <h1>Link Keeper</h1>
    <span id="tally"></span>
  </header>

  <div class="meter"><i class="k" id="bar-kept"></i><i class="s" id="bar-seen"></i><i class="x" id="bar-skipped"></i></div>

  <div class="grid" style="margin-top:.55rem">
    <button class="go" id="open-list">Open list</button>
    <button class="go" id="open-cards">Cards</button>
  </div>

  <div class="now">
    <div class="lbl" id="now-lbl">next</div>
    <div class="url" id="now-url">list is empty</div>
  </div>

  <div class="grid">
    <input class="wide" id="note" placeholder="note for the next keep (optional)">
    <button class="keep" id="keep" title="Ctrl+Shift+K">Keep</button>
    <button id="keep-shot" title="Keep, then scroll and stitch a full-page PNG">Keep + shot</button>
    <button id="skip" title="Ctrl+Shift+X — mark as rejected, then advance">Skip</button>
    <button class="big" id="next" title="Ctrl+Shift+J — advance without judging">Next →</button>
  </div>

  <p class="keys"><kbd>&#8963;&#8679;K</kbd> keep · <kbd>&#8963;&#8679;J</kbd> next · <kbd>&#8963;&#8679;U</kbd> queue · <kbd>&#8963;&#8679;X</kbd> skip</p>

  <div id="msg-row">
    <div id="msg"></div>
    <button id="copy-msg" hidden title="Copy this message">copy</button>
  </div>

  <ul id="recent"></ul>

  <details>
    <summary>Add links</summary>
    <textarea id="urls" placeholder="one URL per line"></textarea>
    <div class="grid">
      <button id="queue">This page</button>
      <button class="go" id="add">Add</button>
    </div>
  </details>

  <details>
    <summary>Export &amp; housekeeping</summary>
    <div class="grid">
      <button class="go" id="export">Export captures</button>
      <button id="export-list">Export list</button>
      <label class="wide" id="import-label" for="import-captures">Import captures from a JSONL file
        <input id="import-captures" type="file" accept=".jsonl,.json,.ndjson" hidden></label>
      <button id="reset">Reset seen</button>
      <button class="danger" id="clear-captures">Clear captures</button>
      <button class="danger wide" id="clear-list">Clear list</button>
    </div>
    <input id="folder" placeholder="link-keeper" title="Subfolder inside Downloads for screenshots">
    <p>Screenshots go to <code>Downloads/<span id="folder-echo">link-keeper</span>/</code> — extensions
    cannot write elsewhere; symlink it if you need to. Exports land in Downloads as JSONL. Reset
    clears “seen”, never “kept”.</p>
  </details>

  <script src="popup.js"></script>
</body>
</html>
