<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="nav.css">
<link rel="stylesheet" href="tags.css">
<link rel="stylesheet" href="actions.css">
<title>Link Keeper — explore</title>
<style>
  :root {
    /* Measured in WCAG 2 and APCA on every ground these pages use. WCAG overrates light text on a
       dark ground, so the dark greys, accent and reds were lifted until APCA agreed; only lightness
       moved. --field is a field's edge (3:1), --prose is text that runs to lines (Lc 75+). */
    --bg: #fbfaf8; --panel: #fff; --ink: #1a1a1a; --dim: #555555; --line: #e4e0da; --mark: #8a857d; --field: #95918b; --prose: #555555;
    --accent: #6647e6; --on-accent: #fff; --ok: #107647; --bad: #b33a28; --seen: #8a7a3f; --chip: #f1eee9;
    --img-outline: rgb(0 0 0 / .1); --shadow: 0 8px 24px rgb(0 0 0 / .12), 0 1px 3px rgb(0 0 0 / .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --panel: #22252a; --ink: #e8e6e3; --dim: #c0bdb9; --line: #2c2f34; --mark: #6b6f77; --field: #7d8289; --prose: #d8d5d1;
      --accent: #c1b4fe; --on-accent: #16171a; --ok: #4fcf95; --bad: #ffa693; --seen: #d8c47a; --chip: #2a2e34;
      --img-outline: rgb(255 255 255 / .1); --shadow: 0 8px 24px rgb(0 0 0 / .45), 0 1px 3px rgb(0 0 0 / .3);
    }
  }
  :root { --keep-bg: #e4f5ec; --drop-bg: #fbe9e5; }
  @media (prefers-color-scheme: dark) { :root { --keep-bg: #17301f; --drop-bg: #33191a; } }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; --nav-inset: 16px; display: grid; grid-template-rows: auto auto minmax(0, 1fr); background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button, select, .btn {
    font: inherit; font-size: .875rem; line-height: 1.2; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 6px 12px;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
    text-decoration: none; white-space: nowrap;
  }
  select { border-color: var(--field); }
  button:disabled { opacity: .5; cursor: default; }
  @media (hover: hover) { button:hover:not(:disabled), .btn:hover, select:hover { border-color: var(--accent); } }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.keep { color: var(--ok); font-weight: 600; } button.drop { color: var(--bad); font-weight: 600; }
  button.keep[aria-pressed="true"] { background: var(--keep-bg); border-color: var(--ok); }
  button.drop[aria-pressed="true"] { background: var(--drop-bg); border-color: var(--bad); }

  /* --- top bar --- */
  .top {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 16px;
    border-bottom: 1px solid var(--line); background: var(--bg);
  }
  h1 { margin: 0 8px 0 0; font-size: 1.125rem; letter-spacing: -.01em; white-space: nowrap; }
  #scope { max-width: 16rem; }
  #q {
    flex: 1 1 12rem; min-width: 0; min-height: 32px; padding: 5px 10px; font: inherit; font-size: .875rem;
    color: var(--ink); background: var(--panel); border: 1px solid var(--field); border-radius: 8px;
  }
  .seg { display: flex; gap: 4px; }
  .chip { min-height: 30px; padding: 4px 10px; border-radius: 999px; font-size: .8125rem; font-variant-numeric: tabular-nums; }
  .chip .n { color: var(--dim); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .chip[aria-pressed="true"] .n { color: inherit; }

  /* --- two panes --- */
  .panes { display: grid; grid-template-columns: minmax(16rem, 24rem) minmax(0, 1fr); min-height: 0; }
  #side { overflow-y: auto; border-right: 1px solid var(--line); padding: 0 0 24px; }
  /* Each stash is a band of its own: a filled heading ruled above and below, and a gap before the
     next one, so where one group ends is plain at a glance — also while its heading is stuck on top. */
  #side h2 {
    position: sticky; top: 0; z-index: 1; margin: 0; padding: 9px 14px; background: var(--panel);
    border-block: 1px solid var(--line);
    font-size: .75rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink);
    display: flex; gap: 8px;
  }
  #side h2:first-child { border-top: 0; }
  #side ul + h2 { margin-top: 16px; }
  #side h2 .n { margin-left: auto; color: var(--dim); font-weight: 600; font-variant-numeric: tabular-nums; }
  #side ul { list-style: none; margin: 0; padding: 4px 6px 6px; }
  #side li button {
    display: grid; grid-template-columns: 16px minmax(0, 1fr) 12px 14px; gap: 8px; align-items: center;
    width: 100%; min-height: 30px; padding: 4px 8px; border: 0; border-radius: 6px; background: none;
    text-align: left; font-size: .8125rem;
  }
  @media (hover: hover) { #side li button:hover { background: var(--chip); } }
  #side li button[aria-current="true"] { background: var(--accent); color: var(--on-accent); }
  #side li .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #side li .t.plain { font-family: ui-monospace, Menlo, monospace; font-size: .75rem; }
  #side li.drop .t { text-decoration: line-through; opacity: .75; }
  #side li .m { font-size: .75rem; font-weight: 700; text-align: center; }
  #side li.keep .m::before { content: "✓"; color: var(--ok); }
  #side li.drop .m::before { content: "✕"; color: var(--bad); }
  #side li button[aria-current="true"] .m::before { color: inherit; }
  .src { display: inline-block; width: 16px; height: 16px; background: center/contain no-repeat; border-radius: 4px; }
  .side-empty { padding: 24px 16px; color: var(--dim); font-size: .875rem; }

  #detail { overflow-y: auto; padding: 20px 24px 48px; }
  .dhead { display: flex; align-items: center; gap: 12px; }
  .dhead .src { width: 36px; height: 36px; border-radius: 8px; }
  .where { font-weight: 650; }
  .when { color: var(--dim); font-size: .8125rem; font-variant-numeric: tabular-nums; }
  .pos { margin-left: auto; white-space: nowrap; color: var(--dim); font-size: .8125rem; font-variant-numeric: tabular-nums; }
  .dtitle {
    margin: 14px 0 6px; font-size: 1.5rem; line-height: 1.25; letter-spacing: -.015em; overflow-wrap: anywhere; text-wrap: pretty;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;
  }
  .dtitle.plain { font: 1.05rem/1.5 ui-monospace, Menlo, monospace; }
  .durl { font: .8125rem/1.5 ui-monospace, Menlo, monospace; color: var(--dim); overflow-wrap: anywhere; user-select: all; }
  #detail .lk-bar { margin-top: 14px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .badge { padding: 1px 9px; border-radius: 999px; background: var(--chip); font-size: .75rem; line-height: 1.6; }
  .badge.keep { color: var(--ok); background: var(--keep-bg); font-weight: 600; }
  .badge.drop { color: var(--bad); background: var(--drop-bg); font-weight: 600; }
  button.link { min-height: 0; padding: 1px 9px; border: 0; border-radius: 999px; background: var(--chip); color: var(--accent); font-size: .75rem; }

  section.box { margin-top: 22px; }
  section.box > h3 {
    margin: 0 0 8px; font-size: .75rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--dim);
  }
  .captext { color: var(--prose); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 16rem; overflow-y: auto; }
  .who { font-weight: 600; color: var(--ink); }
  .thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .thumbs img { height: 6rem; max-width: 12rem; object-fit: cover; border-radius: 6px; background: var(--chip); outline: 1px solid var(--img-outline); outline-offset: -1px; }
  .inner { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .inner a { max-width: 24rem; padding: 1px 10px; border-radius: 999px; background: var(--chip); color: var(--accent); font-size: .8125rem; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .facts { margin: 0; padding: 0; list-style: none; color: var(--prose); font-size: .875rem; display: grid; gap: 4px; }
  .facts li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .muted { color: var(--dim); font-size: .875rem; margin: 0; }

  .tagrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 12px 0 0; }
  .tagrow-label { font-size: .75rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
  .tagrow .tagger { flex: 1 1 20rem; }
  .pvbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .pvbar label { display: inline-flex; align-items: center; gap: 6px; font-size: .875rem; cursor: pointer; }
  #pv-frame { display: block; width: 100%; height: 70vh; margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .pvnote { margin: 8px 0 0; color: var(--dim); font-size: .8125rem; }
  kbd { padding: 0 4px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--chip); font: .75rem ui-sans-serif, -apple-system, sans-serif; }
  .keys { margin-top: 14px; color: var(--dim); font-size: .8125rem; }
  #msg { margin: 10px 0 0; color: var(--dim); font-size: .875rem; }
  #msg:empty { display: none; }
  .captext + .facts, .thumbs + .facts, .inner + .facts { margin-top: 12px; }
  .empty { margin: 15vh auto; max-width: 28rem; text-align: center; color: var(--dim); }
  .empty b { display: block; color: var(--ink); font-size: 1.1rem; margin-bottom: 4px; }

  @media (max-width: 48rem) {
    body { display: block; height: auto; }
    .panes { display: block; }
    #side { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); }
    #detail { overflow: visible; padding: 16px; }
  }
</style>
</head>
<body>
<script src="nav.js"></script>
<header class="top">
  <h1>Explore</h1>
  <select id="scope" aria-label="Which stash or list"></select>
  <label class="sr-only" for="q">Filter</label>
  <input id="q" type="search" placeholder="Filter by title or URL…" autocomplete="off" spellcheck="false">
  <div class="seg" role="group" aria-label="Verdict">
    <button class="chip" data-f="all" aria-pressed="true">All</button>
    <button class="chip" data-f="open" aria-pressed="false">Undecided</button>
    <button class="chip" data-f="keep" aria-pressed="false">Kept</button>
    <button class="chip" data-f="drop" aria-pressed="false">Dropped</button>
  </div>
</header>
<div class="panes">
  <nav id="side" aria-label="Stashed tabs"></nav>
  <main id="detail"></main>
</div>
<script src="icons.js"></script>
<script src="link-view.js"></script>
<script src="link-keys.js"></script>
<script src="link-actions.js"></script>
<script src="peek.js"></script>
<script src="stash-cards.js"></script>
</body>
</html>
