<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="nav.css">
<link rel="stylesheet" href="tags.css">
<link rel="stylesheet" href="actions.css">
<title>Link Keeper: cards</title>
<style>
  :root {
    /* Measured in WCAG 2 and APCA on every ground these pages use. WCAG overrates light text on a
       dark ground, so the dark greys, accent and reds were lifted until APCA agreed; only lightness
       moved. --field is a field's edge (3:1), --prose is text that runs to lines (Lc 75+). */
    --bg: #fbfaf8; --panel: #ffffff; --ink: #1a1a1a; --dim: #555555; --prose: #555555;
    --line: #e4e0da; --accent: #6647e6; --chip: #f1eee9;
    --keep: #057c4d; --keep-bg: #e4f5ec; --skip: #bf3f2d; --skip-bg: #fbe9e5;
    --shadow: 0 10px 30px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --panel: #22252a; --ink: #e8e6e3; --dim: #c0bdb9; --prose: #d8d5d1;
      --line: #2c2f34; --accent: #c1b4fe; --chip: #2a2e34;
      --keep: #54d399; --keep-bg: #17301f; --skip: #ffa693; --skip-bg: #33191a;
      --shadow: 0 14px 34px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 1.25rem 4rem; --gutter: 1.25rem; --nav-gap: 2rem; background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 34rem; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: .6rem; margin-bottom: .6rem; }
  h1 { font-size: 1.2rem; margin: 0; letter-spacing: -.02em; }

  .meter { height: 5px; background: var(--chip); border-radius: 3px; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--accent); }
  @media (prefers-reduced-motion: no-preference) {
    .meter i { transition: width .25s ease; }
  }
  .tally {
    display: flex; gap: 1rem; flex-wrap: wrap; color: var(--dim); font-size: .82rem;
    margin: .5rem 0 1.2rem; font-variant-numeric: tabular-nums;
  }
  .tally b { color: var(--ink); }
  .tally .k b { color: var(--keep); } .tally .x b { color: var(--skip); }

  #stage { position: relative; height: 27rem; touch-action: none; }
  .card {
    position: absolute; inset: 0; background: var(--panel); border: 1px solid var(--line);
    border-radius: 1rem; box-shadow: var(--shadow); padding: 1.4rem 1.4rem 1.2rem;
    display: flex; flex-direction: column; gap: .7rem; overflow: hidden;
    will-change: transform; user-select: none;
  }
  .card > .title, .card > .body { min-height: 0; }
  .card.top { cursor: grab; }
  .card.top:active { cursor: grabbing; }
  .head { display: flex; align-items: center; gap: .75rem; }
  .mono {
    width: 2.5rem; height: 2.5rem; border-radius: .6rem; display: grid; place-items: center;
    font-weight: 700; font-size: 1.1rem; color: #fff; flex: none;
  }
  .host { font-size: 1.05rem; font-weight: 650; overflow-wrap: anywhere; }
  .when { color: var(--dim); font-size: .78rem; font-variant-numeric: tabular-nums; }
  .title {
    font-weight: 600; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden;
  }
  .body {
    color: var(--prose); font-size: .9rem; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .path {
    font-family: ui-monospace, Menlo, monospace; font-size: .82rem; color: var(--dim);
    overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  .note { background: var(--chip); border-radius: .5rem; padding: .5rem .7rem; font-size: .88rem; }
  .inner { display: flex; flex-wrap: wrap; gap: .3rem; }
  .inner a {
    font-size: .8rem; color: var(--accent); text-decoration: none; background: var(--chip);
    border-radius: 1rem; padding: .15rem .55rem; max-width: 100%; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .inner.replies a { background: transparent; border: 1px dashed var(--line); }
  .inner.replies a.from-author { border-style: solid; border-color: var(--keep); color: var(--keep); }
  .done kbd { background: var(--chip); border: 1px solid var(--line); border-radius: .3rem; padding: 0 .25rem; }
  .thumbs { display: flex; gap: .35rem; flex-wrap: wrap; }
  .thumbs { flex: none; }
  .thumbs img {
    height: 3.5rem; max-width: 7rem; object-fit: cover; border-radius: .3rem; border: 1px solid var(--line);
  }
  .foot { margin-top: auto; display: flex; align-items: center; gap: .7rem; flex: none; }
  .open {
    font: inherit; font-size: .88rem; color: var(--accent); text-decoration: none;
    border: 1px solid var(--line); border-radius: .5rem; padding: .35rem .75rem;
  }
  .open:hover { border-color: var(--accent); }
  .siblings { color: var(--dim); font-size: .78rem; }
  /* Where else the card's URL is held, above its foot. */
  .ctx { margin-top: auto; flex: none; border-top: 1px solid var(--line); padding-top: .7rem; font-size: .8rem; color: var(--dim); overflow-wrap: anywhere; }
  .ctx + .foot { margin-top: 0; }

  /* Every stash on show and the reading list, as Explore's sidebar lists them. */
  .layout { display: grid; grid-template-columns: minmax(16rem, 22rem) minmax(0, 1fr); gap: 2rem; align-items: start; }
  #side {
    position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: .8rem; font-size: .8125rem;
  }
  #side:empty { display: none; }
  #side .grp + .grp { border-top: 1px solid var(--line); }
  #side h2 {
    position: sticky; top: 0; z-index: 1; display: flex; gap: .5rem; align-items: baseline; margin: 0; padding: .7rem .8rem .2rem;
    background: var(--panel); font-size: .75rem; letter-spacing: .04em; text-transform: uppercase;
  }
  #side h2 .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #side h2 .n { margin-left: auto; flex: none; color: var(--dim); font-variant-numeric: tabular-nums; text-transform: none; letter-spacing: 0; }
  #side ul { list-style: none; margin: 0; padding: .2rem .35rem .5rem; }
  #side li button {
    display: grid; grid-template-columns: 16px minmax(0, 1fr) 12px 1rem; align-items: center; gap: .5rem; width: 100%;
    padding: .3rem .45rem; font: inherit; text-align: left; color: var(--ink); background: none; border: 0; border-radius: .4rem; cursor: pointer;
  }
  @media (hover: hover) { #side li button:hover { background: var(--chip); } }
  #side li button[aria-current] { background: var(--accent); color: var(--bg); font-weight: 600; }
  #side li .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #side li .t.plain { font-family: ui-monospace, Menlo, monospace; font-size: .75rem; }
  #side li .m { font-weight: 700; text-align: center; }
  .src { display: inline-block; width: 16px; height: 16px; background: center/contain no-repeat; border-radius: 4px; }
  @media (max-width: 52rem) {
    .layout { display: block; }
    #side { position: static; max-height: 35vh; margin-bottom: 1.5rem; }
  }

  .stamp {
    position: absolute; top: 1.2rem; padding: .25rem .65rem; border-radius: .4rem; font-weight: 700;
    font-size: .9rem; letter-spacing: .08em; text-transform: uppercase; opacity: 0;
    pointer-events: none; border: 2px solid currentColor;
  }
  .stamp.keep { right: 1.2rem; color: var(--keep); background: var(--keep-bg); transform: rotate(9deg); }
  .stamp.skip { left: 1.2rem; color: var(--skip); background: var(--skip-bg); transform: rotate(-9deg); }

  .actions { display: flex; justify-content: center; gap: .5rem; flex-wrap: wrap; margin-top: 1.1rem; }
  .actions button {
    font: inherit; cursor: pointer; border-radius: .6rem; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); padding: .5rem 1rem;
  }
  .actions button:hover:not(:disabled) { border-color: var(--accent); }
  /* Dim, but still legible as the three moves (Lc 35+); .4 left them at Lc 18. */
  .actions button:disabled { opacity: .65; cursor: default; }
  .actions { flex-direction: column; align-items: center; }
  .actions .lk-bar { justify-content: center; }
  .actions button { display: inline-flex; align-items: center; gap: .45rem; padding: .4rem .7rem; font-size: .9rem; }
  .actions button kbd { padding: 0 .25rem; font-size: .68rem; }
  .actions button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
  .keys { text-align: center; color: var(--dim); font-size: .8rem; margin-top: .8rem; }
  kbd { background: var(--chip); border: 1px solid var(--line); border-bottom-width: 2px;
        border-radius: .3rem; padding: .05rem .3rem; font: inherit; font-size: .76rem; }
  .done {
    text-align: center; padding: 4rem 1rem; border: 1px dashed var(--line); border-radius: 1rem;
    color: var(--prose);
  }
  .done b { display: block; color: var(--ink); font-size: 1.1rem; margin-bottom: .3rem; }
  .done a { color: var(--accent); }
  #deal-tag {
    margin-left: auto; max-width: 14rem; min-height: 30px; padding: 3px 8px; font: inherit; font-size: .8125rem;
    color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .card .head .tags { margin-left: auto; justify-content: flex-end; max-width: 45%; }
  #msg { text-align: center; color: var(--dim); font-size: .8rem; min-height: 1.1rem; margin-top: .6rem; }
</style>
</head>
<body>
<script src="nav.js"></script>
<div class="layout">
<aside id="side" aria-label="All stashes shown"></aside>
<div class="wrap">
  <header>
    <h1>One at a time</h1>
    <label class="sr-only" for="deal-tag">Which links</label>
    <select id="deal-tag" title="Every link, one tag, the untagged ones or those not captured"></select>
  </header>

  <div class="meter"><i id="bar"></i></div>
  <div class="tally">
    <span id="pos">—</span>
    <span class="x">removed <b id="t-removed">0</b></span>
    <span>skipped <b id="t-skipped">0</b></span>
    <span>left <b id="t-left">0</b></span>
  </div>

  <div id="stage"></div>

  <div class="actions" id="actions"></div>
  <p class="keys" id="keys-line"></p>
  <div id="msg"></div>
</div>
</div>
<script src="icons.js"></script>
<script src="link-view.js"></script>
<script src="link-keys.js"></script>
<script src="link-actions.js"></script>
<script src="peek.js"></script>
<script src="cards.js"></script>
</body>
</html>
