<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="nav.css">
<link rel="stylesheet" href="tags.css">
<link rel="stylesheet" href="actions.css">
<title>Link Keeper: untagged</title>
<style>
  :root {
    /* Measured in WCAG 2 and APCA on every ground these pages use. WCAG overrates light text on a
       dark ground, so the dark greys, accent and reds were lifted until APCA agreed; only lightness
       moved. --field is a field's edge (3:1), --prose is text that runs to lines (Lc 75+). */
    --bg: #fbfaf8; --panel: #fff; --ink: #1a1a1a; --dim: #555555; --line: #e4e0da; --mark: #8a857d; --field: #95918b; --prose: #555555;
    --accent: #6647e6; --on-accent: #fff; --ok: #107647; --bad: #b33a28; --seen: #8a7a3f; --chip: #f1eee9;
    --img-outline: rgb(0 0 0 / .1); --shadow: 0 8px 24px rgb(0 0 0 / .12), 0 1px 3px rgb(0 0 0 / .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --panel: #22252a; --ink: #e8e6e3; --dim: #c0bdb9; --line: #2c2f34; --mark: #6b6f77; --field: #7d8289; --prose: #d8d5d1;
      --accent: #c1b4fe; --on-accent: #16171a; --ok: #4fcf95; --bad: #ffa693; --seen: #d8c47a; --chip: #2a2e34;
      --img-outline: rgb(255 255 255 / .1); --shadow: 0 8px 24px rgb(0 0 0 / .45), 0 1px 3px rgb(0 0 0 / .3);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; padding: 0 20px 80px; --gutter: 20px; --nav-gap: 32px; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  .wrap { max-width: 64rem; margin: 0 auto; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* --- header: what this is, and the page-level actions --- */
  .top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; }
  .heading { margin-right: auto; }
  h1 { font-size: 1.5rem; line-height: 1.15; letter-spacing: -.02em; margin: 0 0 4px; }
  .sub { margin: 0; color: var(--dim); font-size: .875rem; font-variant-numeric: tabular-nums; }
  .page-actions { display: flex; flex-wrap: wrap; gap: 8px; }

  .meter { height: 5px; margin-top: 16px; background: var(--chip); border-radius: 3px; overflow: hidden; display: flex; }
  .meter i { height: 100%; }
  .meter .k { background: var(--ok); } .meter .s { background: var(--seen); } .meter .x { background: var(--bad); }

  /* --- controls --- */
  button, select, .btn {
    font: inherit; font-size: .875rem; line-height: 1.2; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 7px 12px;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
    text-decoration: none; white-space: nowrap;
    transition-property: border-color, background-color, color; transition-duration: 150ms;
  }
  select { display: inline-block; padding-right: 8px; border-color: var(--field); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.danger, .danger { color: var(--bad); }
  button.small { font-size: .8125rem; min-height: 28px; padding: 4px 10px; }
  button.ghost { background: none; border-color: transparent; color: var(--dim); }
  button.ghost.danger { color: var(--bad); }
  @media (hover: hover) {
    button:hover:not(:disabled), select:hover, .btn:hover { border-color: var(--accent); }
    button.danger:hover:not(:disabled) { border-color: var(--bad); }
    button.ghost:hover:not(:disabled) { background: var(--chip); border-color: transparent; color: var(--ink); }
    button.ghost.danger:hover:not(:disabled) { color: var(--bad); }
  }
  @media (prefers-reduced-motion: no-preference) {
    .meter i { transition: width .25s ease; }
  }

  .bar {
    position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    padding: 12px 0; background: var(--bg); border-bottom: 1px solid var(--line);
  }
  #q {
    flex: 1 1 14rem; min-width: 0; min-height: 34px; padding: 6px 12px; font: inherit; font-size: .9375rem;
    color: var(--ink); background: var(--panel); border: 1px solid var(--field); border-radius: 8px;
  }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip {
    min-height: 30px; padding: 4px 12px; border-radius: 999px; font-size: .8125rem;
    font-variant-numeric: tabular-nums;
  }
  .chip .n { color: var(--dim); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .chip[aria-pressed="true"] .n { color: inherit; }
  .domains { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .domains:empty { display: none; }
  .chip .src { margin: 0; }

  #msg { margin: 12px 0 0; color: var(--dim); font-size: .875rem; }
  #msg:empty { margin: 0; }

  .panel { margin-top: 16px; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .panel h2 { margin: 0 0 4px; font-size: .9375rem; }
  .panel p { margin: 0; color: var(--dim); font-size: .875rem; text-wrap: pretty; }
  .panel .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
  .panel textarea {
    display: block; width: 100%; min-height: 6rem; margin-top: 12px; padding: 8px 10px;
    font: .8125rem/1.5 ui-monospace, Menlo, monospace; color: var(--ink); background: var(--bg);
    border: 1px solid var(--field); border-radius: 8px;
  }
  #import-msg { font-size: .875rem; color: var(--dim); }
  #import-progress { width: 12rem; height: 6px; accent-color: var(--accent); }
  #import-msg.ok { color: var(--ok); } #import-msg.bad { color: var(--bad); }

  /* --- rows: one link each, its editor always open --- */
  #out { margin-top: 16px; }
  ul.tagrows { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  ul.tagrows > li {
    display: grid; grid-template-columns: 16px minmax(0, 1fr) minmax(14rem, 22rem) auto; column-gap: 12px; align-items: start;
    padding: 10px 8px; border-radius: 10px;
  }
  @media (hover: hover) { ul.tagrows > li:hover { background: var(--panel); } }
  ul.tagrows > li:focus-within { background: var(--panel); box-shadow: inset 2px 0 0 var(--accent); }
  ul.tagrows > li.done .ttl::after { content: " ✓"; color: var(--ok); font-weight: 700; }
  .src { display: inline-block; width: 16px; height: 16px; margin-top: 4px; background: center/contain no-repeat; border-radius: 4px; }
  .main { min-width: 0; }
  .ttl {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
    color: var(--ink); text-decoration: none; overflow-wrap: anywhere; font-weight: 600;
  }
  .ttl.plain { font: .8125rem/1.6 ui-monospace, Menlo, monospace; font-weight: 400; }
  @media (hover: hover) { a.ttl:hover { color: var(--accent); } }
  .body {
    margin-top: 2px; color: var(--prose); font-size: .8125rem; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; color: var(--dim); font-size: .8125rem; }
  .meta time { font-variant-numeric: tabular-nums; }
  .badge { padding: 0 8px; border-radius: 999px; background: var(--chip); color: var(--ink); font-size: .75rem; line-height: 1.6; }
  ul.tagrows .tagger { min-width: 0; }
  /* Every row here is a guess or nothing; the key line says what a dashed chip is, once. */
  ul.tagrows .tagstatus:not(.bad) { display: none; }
  .more-row { display: flex; justify-content: center; margin-top: 16px; }
  .empty { padding: 64px 16px; text-align: center; color: var(--dim); border: 1px dashed var(--line); border-radius: 12px; }
  .empty .title { margin: 0 0 4px; color: var(--ink); font-size: 1.0625rem; font-weight: 600; }
  .empty p { margin: 0; }
  .keys { margin: 12px 0 0; color: var(--dim); font-size: .8125rem; }
  .keys + .keys { margin-top: 4px; }
  kbd {
    padding: 0 4px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
    background: var(--chip); font: .8125rem ui-sans-serif, -apple-system, sans-serif;
  }
  @media (max-width: 44rem) {
    ul.tagrows > li { grid-template-columns: 16px minmax(0, 1fr); }
    ul.tagrows .tagger { grid-column: 2; margin-top: 8px; }
  }
</style>
</head>
<body>
<script src="nav.js"></script>
<div class="wrap">
  <header class="top">
    <div class="heading">
      <h1>Untagged</h1>
      <p class="sub" id="sub">Loading…</p>
    </div>
  </header>

  <div class="bar">
    <label class="sr-only" for="q">Filter</label>
    <input id="q" type="search" placeholder="Filter by title, URL or text…" autocomplete="off" spellcheck="false">
    <div class="seg" role="group" aria-label="Which links">
      <button class="chip" data-f="untagged" aria-pressed="true" title="Links with no tag of their own">Untagged</button>
      <button class="chip" data-f="guessed" aria-pressed="false" title="Untagged links that have a suggested tag, shown dashed">Suggested</button>
      <button class="chip" data-f="blank" aria-pressed="false" title="Untagged links with no suggested tag">No suggestion</button>
      <button class="chip" data-f="all" aria-pressed="false" title="All links, tagged or not">All</button>
    </div>
  </div>
  <p class="keys">Type a tag and press <kbd>Enter</kbd>; <kbd>Enter</kbd> on an empty field goes to the next link, <kbd>Esc</kbd> leaves the field. Dashed tags are suggested from the kind of site. Editing a link's tags turns the suggested ones into its own. Tagged links stay in the list with a ✓ until you change the filter.</p>
  <p class="keys" id="keys-line"></p>

  <p id="msg" role="status"></p>
  <div id="out"></div>
</div>
<script src="icons.js"></script>
<script src="link-view.js"></script>
<script src="link-keys.js"></script>
<script src="link-actions.js"></script>
<script src="peek.js"></script>
<script src="tag.js"></script>
</body>
</html>
