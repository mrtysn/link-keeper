<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="nav.css">
<link rel="stylesheet" href="tags.css">
<link rel="stylesheet" href="actions.css">
<title>Link Keeper — tags</title>
<style>
  :root {
    /* Measured in WCAG 2 and APCA on every ground these pages use. WCAG overrates light text on a
       dark ground, so the dark greys, accent and reds were lifted until APCA agreed; only lightness
       moved. --field is a field's edge (3:1), --prose is text that runs to lines (Lc 75+). */
    --bg: #fbfaf8; --panel: #fff; --ink: #1a1a1a; --dim: #555555; --line: #e4e0da; --mark: #8a857d; --field: #95918b; --prose: #555555;
    --accent: #6647e6; --on-accent: #fff; --ok: #107647; --bad: #b33a28; --seen: #8a7a3f; --chip: #f1eee9;
    --img-outline: rgb(0 0 0 / .1); --shadow: 0 8px 24px rgb(0 0 0 / .12), 0 1px 3px rgb(0 0 0 / .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --panel: #22252a; --ink: #e8e6e3; --dim: #c0bdb9; --line: #2c2f34; --mark: #6b6f77; --field: #7d8289; --prose: #d8d5d1;
      --accent: #c1b4fe; --on-accent: #16171a; --ok: #4fcf95; --bad: #ffa693; --seen: #d8c47a; --chip: #2a2e34;
      --img-outline: rgb(255 255 255 / .1); --shadow: 0 8px 24px rgb(0 0 0 / .45), 0 1px 3px rgb(0 0 0 / .3);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; padding: 0 20px 80px; --gutter: 20px; --nav-gap: 32px; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  .wrap { max-width: 64rem; margin: 0 auto; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* --- header: what this is, and the page-level actions --- */
  .top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; }
  .heading { margin-right: auto; }
  h1 { font-size: 1.5rem; line-height: 1.15; letter-spacing: -.02em; margin: 0 0 4px; }
  .sub { margin: 0; color: var(--dim); font-size: .875rem; font-variant-numeric: tabular-nums; }
  .page-actions { display: flex; flex-wrap: wrap; gap: 8px; }

  .meter { height: 5px; margin-top: 16px; background: var(--chip); border-radius: 3px; overflow: hidden; display: flex; }
  .meter i { height: 100%; }
  .meter .k { background: var(--ok); } .meter .s { background: var(--seen); } .meter .x { background: var(--bad); }

  /* --- controls --- */
  button, select, .btn {
    font: inherit; font-size: .875rem; line-height: 1.2; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 7px 12px;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
    text-decoration: none; white-space: nowrap;
    transition-property: border-color, background-color, color; transition-duration: 150ms;
  }
  select { display: inline-block; padding-right: 8px; border-color: var(--field); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.danger, .danger { color: var(--bad); }
  button.small { font-size: .8125rem; min-height: 28px; padding: 4px 10px; }
  button.ghost { background: none; border-color: transparent; color: var(--dim); }
  button.ghost.danger { color: var(--bad); }
  @media (hover: hover) {
    button:hover:not(:disabled), select:hover, .btn:hover { border-color: var(--accent); }
    button.danger:hover:not(:disabled) { border-color: var(--bad); }
    button.ghost:hover:not(:disabled) { background: var(--chip); border-color: transparent; color: var(--ink); }
    button.ghost.danger:hover:not(:disabled) { color: var(--bad); }
  }
  @media (prefers-reduced-motion: no-preference) {
    .meter i { transition: width .25s ease; }
  }

  #msg { margin: 12px 0 0; color: var(--dim); font-size: .875rem; }
  #msg:empty { margin: 0; }
  .keys { margin: 12px 0 0; color: var(--dim); font-size: .8125rem; }
  kbd {
    padding: 0 4px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
    background: var(--chip); font: .8125rem ui-sans-serif, -apple-system, sans-serif;
  }
  input[type="text"], input[type="search"] {
    min-height: 34px; padding: 6px 12px; font: inherit; font-size: .9375rem;
    color: var(--ink); background: var(--panel); border: 1px solid var(--field); border-radius: 8px;
  }

  /* --- a new tag: its name and colour --- */
  .maker { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 20px; padding: 12px 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .maker input { flex: 1 1 12rem; min-width: 0; }
  .hues { display: flex; flex-wrap: wrap; gap: 4px; }
  .hues button {
    width: 22px; min-height: 22px; height: 22px; padding: 0; border-radius: 999px;
    background: hsl(var(--h) 65% 55%); border: 2px solid transparent;
  }
  .hues button.auto { background: conic-gradient(from 0deg, hsl(0 65% 60%), hsl(120 65% 55%), hsl(240 65% 65%), hsl(360 65% 60%)); }
  .hues button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 2px var(--panel); }

  /* --- two panes: the tags, and the links of the chosen one --- */
  .layout { display: grid; grid-template-columns: minmax(14rem, 18rem) minmax(0, 1fr); gap: 24px; align-items: start; margin-top: 20px; }
  #lib { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; padding: 6px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  #lib h2 { margin: 6px 8px; color: var(--dim); font-size: .75rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  #lib ul { list-style: none; margin: 0; padding: 0; }
  #lib li button {
    display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%;
    min-height: 32px; padding: 4px 10px; border: 0; border-radius: 8px; background: none; text-align: left;
  }
  #lib li button .dot { width: 10px; height: 10px; border-radius: 999px; background: hsl(var(--h) 60% 55%); }
  #lib li button .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #lib li button .n { color: var(--dim); font-size: .8125rem; font-variant-numeric: tabular-nums; }
  #lib li button.empty-tag .t { color: var(--dim); }
  @media (hover: hover) { #lib li button:hover { background: var(--chip); } }
  #lib li button[aria-current] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  #lib li button[aria-current] .n { color: inherit; }

  #coll { min-width: 0; }
  .coll-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .coll-head h2 { margin: 0; font-size: 1.375rem; letter-spacing: -.01em; }
  .coll-head h2 .tag { font-size: 1.125rem; padding: 2px 12px; }
  .coll-head .count { color: var(--dim); font-size: .875rem; }
  .coll-head .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }
  .coll-head .hues { flex-basis: 100%; }
  .coll-head input { width: 14rem; }
  ul.rows { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 2px; }
  ul.rows > li {
    display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; column-gap: 12px; align-items: start;
    padding: 10px 8px; border-radius: 10px; scroll-margin: 60px;
  }
  @media (hover: hover) { ul.rows > li:hover { background: var(--panel); } }
  .src { display: inline-block; width: 16px; height: 16px; margin-top: 4px; background: center/contain no-repeat; border-radius: 4px; }
  .main { min-width: 0; }
  .ttl {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
    color: var(--ink); text-decoration: none; overflow-wrap: anywhere; font-weight: 600;
  }
  .ttl.plain { font: .8125rem/1.6 ui-monospace, Menlo, monospace; font-weight: 400; }
  @media (hover: hover) { a.ttl:hover { color: var(--accent); } }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 4px; color: var(--dim); font-size: .8125rem; }
  .meta time { font-variant-numeric: tabular-nums; }
  .empty { padding: 48px 16px; text-align: center; color: var(--dim); border: 1px dashed var(--line); border-radius: 12px; margin-top: 12px; }
  .empty .title { margin: 0 0 4px; color: var(--ink); font-size: 1.0625rem; font-weight: 600; }
  .empty p { margin: 0; }
  .lk-pane-on#lib { box-shadow: inset 0 2px 0 var(--accent); }

  @media (max-width: 48rem) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    #lib { position: static; max-height: 40vh; }
    ul.rows > li { grid-template-columns: 16px minmax(0, 1fr); }
    ul.rows > li .lk-bar { grid-column: 2; margin-top: 6px; }
  }
</style>
</head>
<body>
<script src="nav.js"></script>
<div class="wrap">
  <header class="top">
    <div class="heading">
      <h1>Tags</h1>
      <p class="sub" id="sub">Loading…</p>
    </div>
  </header>

  <form class="maker" id="maker" autocomplete="off">
    <label class="sr-only" for="new-name">New tag</label>
    <input id="new-name" type="text" placeholder="New tag…" spellcheck="false">
    <div class="hues" id="new-hues" role="group" aria-label="Its colour"></div>
    <button class="primary" type="submit">Create</button>
  </form>
  <p class="keys" id="keys-line"></p>
  <p id="msg" role="status"></p>

  <div class="layout">
    <nav id="lib" aria-label="Tags"></nav>
    <section id="coll" aria-live="polite"></section>
  </div>
</div>
<script src="icons.js"></script>
<script src="link-view.js"></script>
<script src="link-keys.js"></script>
<script src="link-actions.js"></script>
<script src="tags.js"></script>
</body>
</html>
