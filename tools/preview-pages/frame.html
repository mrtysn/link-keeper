<!doctype html>
<meta charset="utf-8">
<meta name="darkreader-lock">
<title>Link Keeper popup states</title>
<!-- Firefox caps a browser-action popup at 600px tall; each frame is that size. -->
<style>
  body { margin: 16px; background: #777; font: 12px system-ui, sans-serif; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  iframe { border: 0; width: 352px; height: 420px; }
  figure { margin: 0; }
  figcaption { color: #fff; margin-top: 4px; }
</style>
<figure><iframe src="popup.html"></iframe><figcaption>A page held in two stashes</figcaption></figure>
<figure><iframe src="popup.html?tab=new&light"></iframe><figcaption>Light, a page not saved yet</figcaption></figure>
<figure><iframe src="popup.html?tab=about&msg"></iframe><figcaption>A browser page, after a capture</figcaption></figure>
