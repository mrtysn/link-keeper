<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Busy App</title></head>
<body>
<p>A page that stops answering right after it loads: its script holds the page for fifteen seconds.</p>
<script>
  addEventListener("load", () => setTimeout(() => { const end = Date.now() + 15000; while (Date.now() < end) {} }, 50));
</script>
</body>
</html>
